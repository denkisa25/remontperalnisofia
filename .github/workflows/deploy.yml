name: Build and deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Fail loudly rather than rsyncing an empty tree over a live site.
      - name: Sanity-check the build
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          count=$(find dist -name '*.html' | wc -l)
          echo "Built $count HTML pages"
          [ "$count" -ge 5 ] || { echo "::error::only $count pages built, expected more"; exit 1; }
          grep -q "лв" dist/index.html && { echo "::error::BGN found in output — prices are EUR only"; exit 1; } || true

      # A 301 into a 404 is worse than no 301 (CLAUDE.md §7). Fails the deploy
      # until every legacy redirect target exists in dist/ — for the /saveti/
      # targets that means the article is no longer `draft: true`.
      - name: Check legacy redirect targets resolve
        run: npm run check:redirects

      # Secrets go through env:, never inline ${{ }} inside run: (no shell injection,
      # no accidental echo into the log).
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          [ -n "${HOST:-}" ] || { echo "::error::CPANEL_HOST secret is empty"; exit 1; }
          [ -n "${SSH_KEY:-}" ] || { echo "::error::CPANEL_SSH_KEY secret is empty"; exit 1; }
          [[ "$PORT" =~ ^[0-9]+$ ]] || { echo "::error::CPANEL_PORT must be a number, got '$PORT'"; exit 1; }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          keys=$(ssh-keyscan -p "$PORT" -H "$HOST" 2>/dev/null || true)
          if [ -z "$keys" ]; then
            echo "::error::ssh-keyscan got no host key from $HOST on port $PORT. Check CPANEL_HOST and CPANEL_PORT, and that the host accepts SSH from GitHub's runners."
            exit 1
          fi
          printf '%s\n' "$keys" >> ~/.ssh/known_hosts

      # --delete keeps the remote clean, but the target directory can also hold
      # files the build does not produce (cPanel's own cgi-bin, .well-known).
      # Exclude them explicitly or they get wiped on every deploy.
      # (contact.php logs now live outside the web root: /home/kickstic/contact-log.)
      - name: Deploy
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
          SSH_USER: ${{ secrets.CPANEL_USER }}
          DEST: ${{ secrets.CPANEL_PATH }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          [ -n "${DEST:-}" ] || { echo "::error::CPANEL_PATH secret is empty"; exit 1; }
          rsync -avz --delete \
            --exclude '.well-known/' \
            --exclude 'cgi-bin/' \
            --exclude '.htpasswd' \
            --exclude 'contact-log/' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $PORT" \
            dist/ \
            "$SSH_USER@$HOST:$DEST"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
